<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 92" fill="none">
  <defs>
    <linearGradient id="boxTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e5c59b"/>
      <stop offset="100%" stop-color="#d2aa77"/>
    </linearGradient>
    <linearGradient id="boxLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c99b63"/>
      <stop offset="100%" stop-color="#b4834b"/>
    </linearGradient>
    <linearGradient id="boxRight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b88851"/>
      <stop offset="100%" stop-color="#9c6e3b"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#065f46" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#boxShadow)">
    <!-- Back Left Bottom Box -->
    <g transform="translate(6, 40)">
      <polygon points="22,0 44,10 22,20 0,10" fill="url(#boxTop)"/>
      <polygon points="0,10 22,20 22,44 0,34" fill="url(#boxLeft)"/>
      <polygon points="22,20 44,10 44,34 22,44" fill="url(#boxRight)"/>
      <polygon points="10,4.5 32,14.5 29,16 7,6" fill="#f3dfc3" opacity="0.75"/>
    </g>

    <!-- Front Right Bottom Box -->
    <g transform="translate(52, 42)">
      <polygon points="24,0 48,11 24,22 0,11" fill="url(#boxTop)"/>
      <polygon points="0,11 24,22 24,46 0,35" fill="url(#boxLeft)"/>
      <polygon points="24,22 48,11 48,35 24,46" fill="url(#boxRight)"/>
      <polygon points="11,5 35,16 32,17.5 8,6.5" fill="#f3dfc3" opacity="0.75"/>
    </g>

    <!-- Top Center Stacked Box -->
    <g transform="translate(30, 8)">
      <polygon points="24,0 48,11 24,22 0,11" fill="url(#boxTop)"/>
      <polygon points="0,11 24,22 24,46 0,35" fill="url(#boxLeft)"/>
      <polygon points="24,22 48,11 48,35 24,46" fill="url(#boxRight)"/>
      <polygon points="11,5 35,16 32,17.5 8,6.5" fill="#f5e3ca" opacity="0.82"/>
      <polygon points="21,21 27,21 27,28 21,28" fill="#8f6333" opacity="0.22"/>
    </g>
  </g>
</svg>
