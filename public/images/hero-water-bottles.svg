<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" fill="none">
  <defs>
    <!-- Water splash gradients -->
    <linearGradient id="splashMain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0f4ff" stop-opacity="0.92"/>
      <stop offset="45%" stop-color="#7cd4fd" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.58"/>
    </linearGradient>
    <linearGradient id="splashDeep" x1="0" y1="0.2" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="bottleGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d8f1ff" stop-opacity="0.92"/>
      <stop offset="18%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="48%" stop-color="#bae6fd" stop-opacity="0.78"/>
      <stop offset="82%" stop-color="#e0f2fe" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="capBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0353c2"/>
      <stop offset="35%" stop-color="#1d9bf0"/>
      <stop offset="70%" stop-color="#0b74f5"/>
      <stop offset="100%" stop-color="#023d94"/>
    </linearGradient>
    <linearGradient id="labelBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8f4ff"/>
      <stop offset="28%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dcedff"/>
    </linearGradient>
    <linearGradient id="leafGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#65c445"/>
      <stop offset="55%" stop-color="#2e8b3c"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="leafGrad2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#166534"/>
      <stop offset="60%" stop-color="#3da34d"/>
      <stop offset="100%" stop-color="#86efac"/>
    </linearGradient>
    <radialGradient id="dropShine" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="55%" stop-color="#7dd3fc" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.55"/>
    </radialGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#034078" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ambient luminous aqua wave ribbon behind bottles -->
  <path d="M10 182 C110 140, 190 198, 300 155 C395 118, 495 170, 635 128 L635 200 L10 200 Z" fill="url(#splashMain)" opacity="0.28"/>
  <path d="M40 196 C155 152, 235 125, 345 148 C445 168, 540 138, 640 165 L640 200 L40 200 Z" fill="#bae6fd" opacity="0.35"/>

  <!-- Dynamic Back Water Splash Arcs -->
  <path d="M120 176 C142 126, 178 96, 224 114 C252 124, 240 152, 272 150 C315 148, 338 92, 384 74 C405 66, 408 86, 388 104 C368 122, 396 144, 434 122 C455 110, 444 156, 404 176 Z" fill="url(#splashDeep)" opacity="0.55"/>
  <path d="M88 168 C118 134, 152 146, 174 118 C192 94, 170 68, 186 58 C198 50, 212 88, 226 112 C244 142, 286 130, 326 112 C366 94, 394 46, 422 44 C432 43, 412 84, 392 108 C372 132, 412 152, 446 138 C422 174, 355 190, 260 190 C180 190, 120 184, 88 168 Z" fill="url(#splashMain)"/>
  <!-- White crisp foam rim highlights -->
  <path d="M126 156 C156 138, 174 118, 186 86 C192 110, 210 132, 244 142 C292 156, 348 118, 398 72" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <path d="M150 170 C205 152, 272 162, 345 142 C382 132, 408 118, 428 102" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>

  <!-- Small Bottle (0,5 L) — Left -->
  <g transform="translate(178, 42)" filter="url(#softShadow)">
    <!-- Cap -->
    <rect x="27" y="0" width="26" height="14" rx="3.5" fill="url(#capBlue)"/>
    <rect x="25" y="13" width="30" height="4" rx="1.5" fill="#0353c2"/>
    <line x1="32" y1="2" x2="32" y2="12" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
    <line x1="38" y1="2" x2="38" y2="12" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
    <line x1="44" y1="2" x2="44" y2="12" stroke="#7dd3fc" stroke-width="1" opacity="0.6"/>
    <!-- Neck & Shoulder -->
    <path d="M28 17 L52 17 L56 26 C67 34, 73 44, 73 58 L73 142 C73 150, 67 154, 58 154 L22 154 C13 154, 7 150, 7 142 L7 58 C7 44, 13 34, 24 26 Z" fill="url(#bottleGlass)" stroke="#7dd3fc" stroke-width="1.2"/>
    <!-- Specular bottle sheen -->
    <path d="M15 44 C19 36, 24 31, 28 27 L28 144 C20 144, 15 140, 15 132 Z" fill="#ffffff" opacity="0.52"/>
    <path d="M62 46 L67 52 L67 138 L62 142 Z" fill="#ffffff" opacity="0.32"/>
    <!-- Bottle Horizontal Ribs -->
    <path d="M10 56 Q40 60 70 56" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
    <path d="M9 124 Q40 128 71 124" stroke="#38bdf8" stroke-width="1" opacity="0.45"/>
    <path d="M9 135 Q40 139 71 135" stroke="#38bdf8" stroke-width="1" opacity="0.4"/>
    <!-- Label -->
    <rect x="8" y="64" width="64" height="52" rx="3" fill="url(#labelBg)"/>
    <path d="M8 106 Q26 98 44 105 T72 103 L72 116 L8 116 Z" fill="#0ea5e9" opacity="0.16"/>
    <!-- Droplet on label -->
    <path d="M40 70 C40 70 34 78 34 82 C34 85.5 36.7 88 40 88 C43.3 88 46 85.5 46 82 C46 78 40 70 40 70 Z" fill="#0b74f5"/>
    <ellipse cx="38" cy="81" rx="1.6" ry="3" fill="#ffffff" opacity="0.7" transform="rotate(-15 38 81)"/>
    <text x="40" y="101" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-weight="800" font-size="13.5" fill="#07224d" letter-spacing="-0.4">GWater</text>
    <text x="40" y="111" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-weight="600" font-size="6.2" fill="#0284c7">0,5 L • Pureté</text>
  </g>

  <!-- Large Bottle (1,5 L) — Right Center -->
  <g transform="translate(262, 10)" filter="url(#softShadow)">
    <!-- Cap -->
    <rect x="33" y="0" width="30" height="16" rx="4" fill="url(#capBlue)"/>
    <rect x="31" y="15" width="34" height="4.5" rx="1.5" fill="#0353c2"/>
    <line x1="39" y1="2" x2="39" y2="14" stroke="#7dd3fc" stroke-width="1.1" opacity="0.65"/>
    <line x1="46" y1="2" x2="46" y2="14" stroke="#7dd3fc" stroke-width="1.1" opacity="0.65"/>
    <line x1="53" y1="2" x2="53" y2="14" stroke="#7dd3fc" stroke-width="1.1" opacity="0.65"/>
    <!-- Neck & Body -->
    <path d="M34 20 L62 20 L67 31 C80 41, 88 53, 88 70 L88 172 C88 182, 81 186, 70 186 L26 186 C15 186, 8 182, 8 172 L8 70 C8 53, 16 41, 29 31 Z" fill="url(#bottleGlass)" stroke="#7dd3fc" stroke-width="1.3"/>
    <!-- Water Level Curve inside upper shoulder -->
    <path d="M18 46 Q48 52 78 46" stroke="#ffffff" stroke-width="2" opacity="0.75"/>
    <!-- Specular Sheen -->
    <path d="M17 55 C22 44, 29 37, 34 32 L34 176 C24 176, 17 171, 17 162 Z" fill="#ffffff" opacity="0.54"/>
    <path d="M74 56 L81 64 L81 168 L74 174 Z" fill="#ffffff" opacity="0.34"/>
    <!-- Ribs -->
    <path d="M11 66 Q48 71 85 66" stroke="#38bdf8" stroke-width="1.2" opacity="0.48"/>
    <path d="M11 148 Q48 153 85 148" stroke="#38bdf8" stroke-width="1.2" opacity="0.48"/>
    <path d="M11 161 Q48 166 85 161" stroke="#38bdf8" stroke-width="1.2" opacity="0.42"/>
    <!-- Label -->
    <rect x="9" y="76" width="78" height="63" rx="4" fill="url(#labelBg)"/>
    <path d="M9 125 Q30 116 52 124 T87 121 L87 139 L9 139 Z" fill="#0ea5e9" opacity="0.16"/>
    <!-- Droplet Icon -->
    <path d="M48 82 C48 82 40.5 92 40.5 97 C40.5 101.2 43.8 104.5 48 104.5 C52.2 104.5 55.5 101.2 55.5 97 C55.5 92 48 82 48 82 Z" fill="#0b74f5"/>
    <ellipse cx="45.5" cy="95.5" rx="2" ry="3.8" fill="#ffffff" opacity="0.72" transform="rotate(-15 45.5 95.5)"/>
    <text x="48" y="121" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-weight="800" font-size="17" fill="#07224d" letter-spacing="-0.5">GWater</text>
    <text x="48" y="133" text-anchor="middle" font-family="Plus Jakarta Sans, Segoe UI, sans-serif" font-weight="600" font-size="7.5" fill="#0284c7">Pureté &amp; Vitalité</text>
  </g>

  <!-- Foreground Water Splash Wrapping Base of Bottles -->
  <path d="M128 190 C160 162, 205 178, 255 164 C308 148, 355 172, 412 152 C432 145, 444 166, 418 186 C362 204, 210 206, 128 190 Z" fill="url(#splashMain)" opacity="0.88"/>
  <path d="M148 186 C188 170, 232 184, 286 168 C332 156, 376 174, 416 158" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>

  <!-- Floating Crystal Water Droplets -->
  <circle cx="145" cy="86" r="5.5" fill="url(#dropShine)"/>
  <circle cx="122" cy="112" r="3.5" fill="url(#dropShine)"/>
  <circle cx="164" cy="54" r="3" fill="url(#dropShine)"/>
  <circle cx="96" cy="94" r="2.5" fill="url(#dropShine)"/>
  <circle cx="386" cy="52" r="6" fill="url(#dropShine)"/>
  <circle cx="412" cy="82" r="4" fill="url(#dropShine)"/>
  <circle cx="436" cy="60" r="3" fill="url(#dropShine)"/>
  <circle cx="368" cy="30" r="3.2" fill="url(#dropShine)"/>
  <circle cx="248" cy="34" r="3.5" fill="url(#dropShine)"/>
  <circle cx="132" cy="144" r="4.5" fill="url(#dropShine)"/>
  <circle cx="458" cy="110" r="3.2" fill="url(#dropShine)"/>

  <!-- Fresh Green Botanical Leaves (Far Right Edge) -->
  <g transform="translate(556, 98)">
    <!-- Back upright leaf -->
    <path d="M44 82 C34 42, 48 10, 82 0 C84 36, 70 68, 44 82 Z" fill="url(#leafGrad2)"/>
    <path d="M45 78 C54 48, 66 24, 79 4" stroke="#bbf7d0" stroke-width="1.3" opacity="0.65"/>
    <!-- Left tilted leaf -->
    <path d="M46 88 C18 76, 4 54, 0 28 C28 32, 48 54, 46 88 Z" fill="url(#leafGrad1)"/>
    <path d="M44 84 C28 66, 16 48, 4 32" stroke="#dcfce7" stroke-width="1.2" opacity="0.6"/>
    <!-- Lower small leaf -->
    <path d="M52 94 C62 72, 74 62, 92 60 C88 80, 74 94, 52 94 Z" fill="url(#leafGrad1)" opacity="0.9"/>
  </g>

  <!-- Subtle leaf accents behind right bottle -->
  <g transform="translate(362, 134) rotate(-18)" opacity="0.85">
    <path d="M0 44 C10 18, 28 4, 54 0 C48 26, 28 42, 0 44 Z" fill="url(#leafGrad2)"/>
    <path d="M3 42 C18 26, 34 14, 51 3" stroke="#dcfce7" stroke-width="1" opacity="0.55"/>
  </g>
</svg>
