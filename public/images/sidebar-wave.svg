<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 150" fill="none">
  <defs>
    <linearGradient id="oceanCard" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0b67e8"/>
      <stop offset="55%" stop-color="#0052c7"/>
      <stop offset="100%" stop-color="#023482"/>
    </linearGradient>
    <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#0284c7" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="waveMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="topGlow" cx="50%" cy="22%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#0052c7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="220" height="150" fill="url(#oceanCard)"/>
  <rect width="220" height="150" fill="url(#topGlow)"/>

  <!-- Back splash wave -->
  <path d="M-10 126 C32 108, 72 132, 118 114 C156 100, 186 122, 230 110 L230 155 L-10 155 Z" fill="url(#waveMid)"/>

  <!-- Front crystal crest wave -->
  <path d="M-10 135 C28 118, 68 140, 114 124 C156 112, 188 134, 230 122 L230 155 L-10 155 Z" fill="url(#waveFront)"/>

  <!-- Sparkling white water rim lines -->
  <path d="M-6 132 C32 116, 70 137, 114 122 C156 110, 190 130, 226 119" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
  <path d="M12 141 C58 128, 108 143, 162 132 C186 126, 206 133, 224 129" stroke="#e0f2fe" stroke-width="1.4" stroke-linecap="round" opacity="0.65"/>

  <!-- Water splash droplets -->
  <circle cx="24" cy="118" r="2.2" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="52" cy="112" r="1.6" fill="#ffffff" opacity="0.85"/>
  <circle cx="136" cy="108" r="2.4" fill="#bae6fd" opacity="0.85"/>
  <circle cx="176" cy="106" r="1.8" fill="#ffffff" opacity="0.8"/>
  <circle cx="198" cy="115" r="2" fill="#e0f2fe" opacity="0.75"/>
</svg>
